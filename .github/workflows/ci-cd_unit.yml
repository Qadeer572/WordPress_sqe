name: WordPress Unit Tests CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Project Structure
        run: |
          echo "🔍 Verifying project structure..."
          if [ -f "src/WP_Backend_Helper.php" ]; then
            echo "✅ Helper file found: src/WP_Backend_Helper.php"
          else
            echo "❌ Helper file not found!"
            exit 1
          fi
          
          if [ -f "tests/Backend_UnitTest.php" ]; then
            echo "✅ Test file found: tests/Backend_UnitTest.php"
          else
            echo "❌ Test file not found!"
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, dom, intl
          coverage: xdebug
          tools: composer

      - name: Check PHP Version
        run: |
          php -v
          php -m | grep -E "(mbstring|xml|ctype|json|dom|intl|xdebug)"

      - name: Create composer.json
        run: |
          echo "📝 Creating composer.json..."
          cat > composer.json << 'EOF'
          {
            "name": "wordpress-sqe/backend-tests",
            "description": "WordPress Backend Unit Tests",
            "type": "project",
            "require": {
              "php": ">=8.0"
            },
            "require-dev": {
              "phpunit/phpunit": "^10.5"
            },
            "autoload": {
              "classmap": ["src/"]
            },
            "autoload-dev": {
              "classmap": ["tests/"]
            },
            "scripts": {
              "test": "phpunit"
            }
          }
          EOF
          cat composer.json

      - name: Install Dependencies (Fix Permission Denied!)
        run: |
          echo "📦 Installing Composer dependencies..."
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

          echo "🔧 Fixing execute permissions on vendor/bin/* (prevents Permission denied errors)"
          chmod +x vendor/bin/phpunit

          echo "✅ PHPUnit installed successfully:"
          vendor/bin/phpunit --version

      - name: Create phpunit.xml (Fixed XML Validation!)
        run: |
          echo "📝 Creating phpunit.xml (PHPUnit 10.5 compatible)..."
          mkdir -p coverage-report test-results
          cat > phpunit.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <phpunit xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:noNamespaceSchemaLocation="https://schema.phpunit.de/10.5/phpunit.xsd"
                   bootstrap="vendor/autoload.php"
                   colors="true"
                   cacheDirectory=".phpunit.cache"
                   failOnRisky="true">
              
              <testsuites>
                  <testsuite name="WordPress Backend Unit Tests">
                      <directory>tests</directory>
                  </testsuite>
              </testsuites>
              
              <coverage>
                  <include>
                      <directory suffix=".php">src</directory>
                  </include>
                  <report>
                      <html outputDirectory="coverage-report"/>
                      <text outputFile="php://stdout" showOnlySummary="true"/>
                  </report>
              </coverage>
              
              <logging>
                  <junit outputFile="test-results/junit.xml"/>
              </logging>
          </phpunit>
          EOF
          echo "✅ phpunit.xml created and validated:"
          cat phpunit.xml

      - name: Run PHPUnit Tests
        run: |
          echo "🧪 Running PHPUnit tests..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          vendor/bin/phpunit --testdox --colors=always
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Setup WordPress for Performance Tests (Optional)
        continue-on-error: true
        run: |
          echo "🔧 Setting up WordPress for performance tests..."
          # Check if WordPress files exist
          if [ -f "wp-config.php" ] || [ -f "wp-config-sample.php" ]; then
            echo "✅ WordPress files detected"
            # Start PHP server in background
            nohup php -S 127.0.0.1:8080 > server.log 2>&1 &
            echo $! > server.pid
            
            # Wait for server
            for i in {1..15}; do
              if curl -s http://127.0.0.1:8080 > /dev/null; then
                echo "✅ Server is ready!"
                break
              fi
              sleep 1
            done
          else
            echo "⚠️ WordPress not found - performance tests will be skipped"
          fi

      - name: Run Performance Tests
        continue-on-error: true
        run: |
          echo "⚡ Running Performance Tests..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          export WP_BASE_URL=http://127.0.0.1:8080
          vendor/bin/phpunit tests/performance/PerformanceTest.php --testdox --colors=always || echo "⚠️ Performance tests skipped (WordPress server not available)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Stop PHP Server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
            rm -f server.pid
          fi

      - name: Generate Full Coverage Report
        if: success()
        run: |
          echo "📊 Generating code coverage report..."
          mkdir -p coverage-report
          vendor/bin/phpunit --coverage-html coverage-report --coverage-text --colors=always

      - name: Display Coverage Summary
        if: success()
        run: |
          echo "📈 Coverage Summary (if report exists):"
          if [ -f "coverage-report/index.html" ]; then
            echo "✅ HTML coverage report generated at coverage-report/index.html"
          else
            echo "ℹ️ No coverage report (no tests or coverage not enabled)"
          fi

      - name: Upload Coverage Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage-report
          path: coverage-report/
          retention-days: 14

      - name: Upload JUnit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-test-results
          path: test-results/
          retention-days: 14

      - name: Test Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ ${{ job.status }} == 'success' ]; then
            echo "🎉 ALL TESTS PASSED!"
          else
            echo "⚠️ SOME TESTS FAILED — Check logs above"
          fi
          echo "📁 Test Files:"
          echo "   - tests/Backend_UnitTest.php (Unit Tests)"
          echo "   - tests/performance/PerformanceTest.php (Performance Tests)"
          echo "📦 Source: src/WP_Backend_Helper.php"
          echo "📊 Reports: Uploaded as artifacts (HTML Coverage + JUnit XML)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"